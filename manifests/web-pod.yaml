apiVersion: v1
kind: Pod
metadata:
  name: web
spec:
  containers:
    - name: web
      image: nginx
      resources:
        # Requests are used by the scheduler when choosing a node.
        requests:
          cpu: "100m"
          memory: "128Mi"
        # The memory limit is the container's maximum runtime memory.
        limits:
          memory: "256Mi"